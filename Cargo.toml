[package]
name = "window-rescue"
version = "0.1.1"
edition = "2021"
description = "Tiny Windows tray app that brings off-screen windows back with one shortcut."
license = "MIT"
repository = "https://github.com/okzea/window-rescue"
publish = false

[[bin]]
name = "WindowRescue"
path = "src/main.rs"

[dependencies.windows-sys]
version = "0.60"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
