# Link the C runtime into the exe. Without this, MSVC builds (the release workflow) need
# VCRUNTIME140.dll, which a clean Windows install does not have.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
