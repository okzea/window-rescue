# Builds the exe and the Store package. A pushed tag (v1.2.3, matching Cargo.toml) also
# publishes a GitHub release with the exe; the MSIX is kept as a workflow artifact for
# uploading to Partner Center, since an unsigned package is no use to anyone else.
#
# Store identity: set the repository variables STORE_IDENTITY_NAME, STORE_PUBLISHER and
# STORE_PUBLISHER_DISPLAY_NAME from Partner Center (they are public in the package anyway).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne '${{ github.ref_name }}') { throw "Tag ${{ github.ref_name }} does not match Cargo.toml ($version)" }

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Package for the Microsoft Store
        shell: pwsh
        env:
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          $identity = @{}
          if ($env:STORE_IDENTITY_NAME) { $identity.IdentityName = $env:STORE_IDENTITY_NAME }
          if ($env:STORE_PUBLISHER) { $identity.Publisher = $env:STORE_PUBLISHER }
          if ($env:STORE_PUBLISHER_DISPLAY_NAME) { $identity.PublisherDisplayName = $env:STORE_PUBLISHER_DISPLAY_NAME }
          ./packaging/pack.ps1 @identity

      - name: Install and start the package
        shell: pwsh
        run: ./packaging/smoke-test.ps1

      - name: Checksums
        shell: pwsh
        run: |
          Get-FileHash dist/WindowRescue.exe, dist/WindowRescue.msix -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: window-rescue
          path: |
            dist/WindowRescue.exe
            dist/WindowRescue.msix
            dist/SHA256SUMS.txt

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          New-Item -ItemType Directory dist/release | Out-Null
          Copy-Item dist/WindowRescue.exe dist/release
          Get-FileHash dist/release/WindowRescue.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  WindowRescue.exe" } | Set-Content dist/release/SHA256SUMS.txt
          gh release create $tag dist/release/WindowRescue.exe dist/release/SHA256SUMS.txt --title "Window Rescue $($tag.TrimStart('v'))" --generate-notes
